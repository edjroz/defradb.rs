[net]
git-fetch-with-cli = true

[build]
# Auto-detect available cores (M3 Ultra = 32)
# jobs defaults to logical CPU count when omitted

# getrandom 0.3 refuses to build for wasm32-unknown-unknown until a backend is
# named, and it is reached transitively (rand, via iroh), so no crate's feature
# list can supply this. Every wasm build needs it, including wasm-pack's.
[target.wasm32-unknown-unknown]
rustflags = ["--cfg", 'getrandom_backend="wasm_js"']
